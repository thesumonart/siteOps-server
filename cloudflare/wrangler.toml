# SiteOps monitoring clock — a Cloudflare Worker that drives the tick.
#
# Deployed separately from the API, from this directory:
#
#   cd cloudflare
#   npx wrangler secret put CRON_SECRET   # the same value Render holds as INTERNAL_API_KEY
#   npx wrangler deploy

name = "api-cron-worker"

# Resolves to cloudflare/src/worker.ts — the Workers-runtime clock. Not to be
# confused with the repository's own src/worker.ts, which is the Node monitoring
# worker process and does not run here.
main = "src/worker.ts"

compatibility_date = "2026-09-09"

# Every minute. This is Cloudflare's finest cron granularity and it is the right
# one: the shortest monitoring interval SiteOps offers is one minute, so a
# coarser trigger would silently cap what a customer can configure.
#
# The tick is idempotent — every claim is an atomic lease — so a trigger that
# fires while the previous one is still running costs one wasted request and
# nothing else.
[triggers]
crons = ["* * * * *"]

[vars]
# The Render service origin to drive. Origin only — worker.ts appends
# /api/internal/monitoring/tick, so a path here would be doubled.
SITEOPS_API_URL = "https://siteops-server.onrender.com"

# CRON_SECRET is a secret, never a [vars] entry — putting it here would commit
# it to the repository. Set it with `wrangler secret put CRON_SECRET`.

[observability]
enabled = true
