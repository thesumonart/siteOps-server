# SiteOps monitoring scheduler — a Cloudflare Worker that drives the tick.
#
# Deployed separately from the API, from this directory:
#
#   cd cloudflare
#   npx wrangler secret put INTERNAL_API_KEY   # the same value the API has
#   npx wrangler deploy
#
# See ../docs/DEPLOYMENT.md for why this exists and what it does not do.

name = "siteops-monitoring-scheduler"
main = "src/scheduler.js"
compatibility_date = "2026-09-01"

# Every minute. This is Cloudflare's finest cron granularity and it is the right
# one: the shortest monitoring interval SiteOps offers is one minute, so a
# coarser trigger would silently cap what a customer can configure.
#
# The tick is idempotent — every claim is an atomic lease — so a trigger that
# fires while the previous one is still running costs one wasted request and
# nothing else.
[triggers]
crons = ["* * * * *"]

[vars]
# The API origin to drive. Overridden per environment below.
SITEOPS_API_URL = "https://siteops-server.onrender.com"

# INTERNAL_API_KEY is a secret, never a var: `wrangler secret put INTERNAL_API_KEY`.
# Putting it here would commit it to the repository.

[observability]
enabled = true

[env.staging]
name = "siteops-monitoring-scheduler-staging"

[env.staging.vars]
SITEOPS_API_URL = "https://siteops-server-staging.onrender.com"
